<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:
          https://tile.openstreetmap.org;
        font-src 'self' data:;
        connect-src 'self' ws: wss:
          http://127.0.0.1:5001
          http://localhost:5001
          https://identitytoolkit.googleapis.com
          https://securetoken.googleapis.com
          https://firestore.googleapis.com
          https://formsubmit.co
          https://australia-southeast2-wasteless-melbourne.cloudfunctions.net
          https://router.project-osrm.org;
        frame-src 'self'
          https://www.openstreetmap.org;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
          https://formsubmit.co;
      "
    >

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    >

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta
      name="description"
      content="WasteLess Melbourne helps users find recycling information, recycling locations and practical waste reduction guidance."
    >

    <link
      rel="icon"
      href="/favicon.ico"
    >

    <title>
      WasteLess Melbourne
    </title>

    <style>
      /*
       * WCAG keyboard accessibility:
       * visible keyboard focus throughout the site.
       */
      :focus-visible {
        outline:
          3px solid #1f6f14 !important;

        outline-offset:
          3px !important;
      }

      /*
       * Skip link is hidden until keyboard users
       * focus it.
       */
      .skip-link {
        position: fixed;
        top: 12px;
        left: 12px;

        z-index: 100000;

        padding: 12px 16px;

        border:
          3px solid #ffffff;

        border-radius: 8px;

        background-color: #1f6f14;
        color: #ffffff;

        font-family:
          Arial,
          sans-serif;

        font-size: 16px;
        font-weight: 700;

        text-decoration: none;

        transform:
          translateY(-200%);

        transition:
          transform 0.15s ease;
      }

      .skip-link:focus {
        transform:
          translateY(0);
      }

      /*
       * Screen-reader-only utility.
       */
      .sr-only {
        position: absolute !important;

        width: 1px !important;
        height: 1px !important;

        padding: 0 !important;
        margin: -1px !important;

        overflow: hidden !important;

        clip:
          rect(
            0,
            0,
            0,
            0
          ) !important;

        white-space:
          nowrap !important;

        border: 0 !important;
      }

      /*
       * Programmatic page-heading focus should
       * not create an unnecessary visual box.
       */
      main h1[tabindex="-1"]:focus {
        outline: none;
      }

      /*
       * Do not remove focus styling when a
       * keyboard user reaches interactive
       * elements.
       */
      button,
      a,
      input,
      select,
      textarea {
        scroll-margin-top: 90px;
      }

      /*
       * Honour users who request less animation.
       */
      @media (
        prefers-reduced-motion:
          reduce
      ) {
        *,
        *::before,
        *::after {
          scroll-behavior:
            auto !important;

          animation-duration:
            0.01ms !important;

          animation-iteration-count:
            1 !important;

          transition-duration:
            0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <a
      class="skip-link"
      href="#main-content"
    >
      Skip to main content
    </a>

    <div
      id="route-announcer"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
