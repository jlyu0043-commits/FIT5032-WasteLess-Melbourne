<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' ws: wss:;
        frame-src 'self' https://www.openstreetmap.org;
        object-src 'none';
        base-uri 'self';
        form-action 'self';

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    >

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" href="/favicon.ico">

    <title>WasteLess Melbourne</title>
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
